<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a365d" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <title>Dashboard | UniCalc Scholar</title>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="../assets/js/app/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/app.css" />

    <style>
      .btn-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: var(--radius);
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s;
      }

      .link-muted,
      .empty-state a,
      .empty-cell a {
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
      }

      .link-muted:hover,
      .empty-state a:hover,
      .empty-cell a:hover {
        text-decoration: underline;
      }

      .header-info h3 {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .header-info p {
        color: var(--text-light);
        font-size: 0.85rem;
        margin-top: 4px;
      }

      #progress-chart {
        height: 100%;
        width: 100%;
      }

      #progress-chart svg {
        display: block;
      }

      .empty-state {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        color: var(--text-light);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .empty-cell {
        grid-column: 1 / -1;
        color: var(--text-light);
        font-size: 0.95rem;
      }

      .content-section {
        margin-top: 10px;
      }

      .activity-table {
        padding: 0;
      }

      .activity-table .col {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      @media (max-width: 600px) {
        .table-row {
          padding: 14px 16px;
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body class="light-mode">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="header-left">
            <button type="button" class="menu-toggle" id="menu-open" aria-label="Open menu">
              <ion-icon name="menu-outline"></ion-icon>
            </button>
            <h1 class="page-title">Dashboard</h1>
          </div>
          <div class="actions">
            <a href="cgpa-calculator.html" class="btn-link btn-primary">
              <ion-icon name="calculator-outline"></ion-icon> Open Calculator
            </a>
          </div>
        </header>

        <section class="dashboard-overview">
          <div class="summary-grid">
            <div class="card q-card grad-orange accent-orange">
              <div class="q-card-body">
                <span class="q-label">Current CGPA</span>
                <div class="q-value" id="stat-cgpa">0.00</div>
                <span class="q-sub" id="stat-cgpa-sub">&nbsp;</span>
              </div>
              <ion-icon name="trending-up" class="q-icon"></ion-icon>
            </div>

            <div class="card q-card grad-blue accent-blue">
              <div class="q-card-body">
                <span class="q-label">Total Units</span>
                <div class="q-value" id="stat-units">0</div>
                <span class="q-sub" id="stat-units-sub">&nbsp;</span>
              </div>
              <ion-icon name="layers" class="q-icon"></ion-icon>
            </div>

            <div class="card q-card grad-lightblue accent-lightblue">
              <div class="q-card-body">
                <span class="q-label">Academic Level</span>
                <div class="q-value" id="stat-level">—</div>
                <span class="q-sub" id="stat-level-sub">&nbsp;</span>
              </div>
              <ion-icon name="school" class="q-icon"></ion-icon>
            </div>

            <div class="card q-card grad-green accent-green">
              <div class="q-card-body">
                <span class="q-label">Your Data</span>
                <div class="q-value" id="stat-saved">Empty</div>
                <span class="q-sub" id="stat-saved-sub">&nbsp;</span>
              </div>
              <ion-icon name="checkmark-circle" class="q-icon"></ion-icon>
            </div>
          </div>

          <div class="card main-graph-card">
            <div class="graph-header">
              <div class="header-info">
                <h3>CGPA Progression</h3>
                <p id="chart-sub">CGPA after each semester</p>
              </div>
              <div class="graph-actions">
                <label for="chart-range" class="sr-only" style="position:absolute;left:-9999px">Chart range</label>
                <select class="graph-select" id="chart-range">
                  <option value="recent">Last 5 Semesters</option>
                  <option value="all">Full Career</option>
                </select>
              </div>
            </div>
            <div class="chart-wrapper">
              <div id="progress-chart"></div>
            </div>
          </div>
        </section>

        <section class="content-section">
          <div class="section-header">
            <h2>Semester Results</h2>
            <a href="academic-records.html" class="link-muted">View all</a>
          </div>

          <div class="card activity-table">
            <div class="table-row header">
              <div class="col">Semester</div>
              <div class="col">Units</div>
              <div class="col">GPA / CGPA</div>
            </div>
            <div id="semester-rows"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="../assets/js/app/shell.js"></script>
    <script type="module" src="../assets/js/pages/dashboard.js"></script>
  </body>
</html>
