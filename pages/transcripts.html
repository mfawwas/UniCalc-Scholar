<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcript | UniCalc Scholar</title>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="../assets/js/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/pages.css" />

    <style>
      .t-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .t-actions button {
        padding: 12px 20px;
      }

      .t-actions button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .t-note {
        flex-basis: 100%;
        color: var(--text-light);
        font-size: 0.85rem;
        line-height: 1.5;
      }

      .t-note a,
      .t-empty a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      .t-note a:hover,
      .t-empty a:hover {
        text-decoration: underline;
      }

      .t-status {
        flex-basis: 100%;
        color: #e53e3e;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .t-status:empty {
        display: none;
      }

      .t-empty {
        text-align: center;
        padding: 48px 20px;
        color: var(--text-light);
        line-height: 1.6;
      }

      .t-sheet {
        padding: 32px;
      }

      .t-head {
        text-align: center;
        padding-bottom: 20px;
        margin-bottom: 24px;
        border-bottom: 2px solid var(--border);
      }

      .t-head h2 {
        font-size: 1.5rem;
        letter-spacing: 0.02em;
        color: var(--primary);
      }

      .t-head p {
        margin-top: 6px;
        color: var(--text-light);
        font-size: 0.95rem;
      }

      .t-year {
        margin-bottom: 28px;
      }

      .t-year h3 {
        font-size: 1.05rem;
        color: var(--primary);
        margin-bottom: 12px;
      }

      .t-year h3 span {
        color: var(--text-light);
        font-weight: 500;
        font-size: 0.9rem;
      }

      .t-sems {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .t-sem {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .t-sem-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        background: var(--bg);
        font-weight: 700;
        font-size: 0.9rem;
      }

      .t-scroll {
        overflow-x: auto;
      }

      .t-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .t-table th,
      .t-table td {
        padding: 8px 14px;
        text-align: left;
        border-top: 1px solid var(--border);
        white-space: nowrap;
      }

      .t-table th {
        color: var(--text-light);
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      .t-none {
        padding: 18px 14px;
        color: var(--text-light);
        font-style: italic;
        font-size: 0.9rem;
      }

      .t-summary {
        margin-top: 8px;
        padding: 20px;
        border: 2px solid var(--border);
        border-radius: var(--radius);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
      }

      .t-summary dt {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--text-light);
        font-weight: 600;
        margin-bottom: 4px;
      }

      .t-summary dd {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--primary);
      }

      .t-foot {
        margin-top: 20px;
        text-align: center;
        color: var(--text-light);
        font-size: 0.8rem;
      }

      @media (max-width: 800px) {
        .t-sheet {
          padding: 20px 16px;
        }

        .t-sems {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        .t-sheet {
          border: none;
          box-shadow: none;
          padding: 0;
          color: #000;
        }

        .t-sems {
          grid-template-columns: 1fr 1fr;
        }

        .t-year,
        .t-sem {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body class="light-mode">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="header-left">
            <button type="button" class="menu-toggle" id="menu-open" aria-label="Open menu">
              <ion-icon name="menu-outline"></ion-icon>
            </button>
            <h1 class="page-title">Transcript</h1>
          </div>
        </header>

        <div class="t-actions no-print">
          <button type="button" class="btn-primary" id="btn-pdf" disabled>
            <ion-icon name="download-outline"></ion-icon> Download PDF
          </button>
          <button type="button" class="btn-secondary" id="btn-print" disabled>
            <ion-icon name="print-outline"></ion-icon> Print
          </button>
          <p class="t-note" id="t-note">
            A personal summary built from the results you entered. It is
            <strong>not</strong> an official or certified transcript.
          </p>
          <p class="t-status" id="t-status" role="status"></p>
        </div>

        <div id="transcript-root"></div>
      </main>
    </div>

    <script type="module" src="../assets/js/shell.js"></script>
    <script type="module" src="../assets/js/transcripts.js"></script>
  </body>
</html>
