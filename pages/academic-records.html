<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a365d" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <title>Academic Records | UniCalc Scholar</title>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="../assets/js/app/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/app.css" />

    <style>
      .session-control {
        margin: 20px 0 30px 0;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 24px;
      }

      .selector-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .selector-wrapper label {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-light);
      }

      #degree-units {
        width: 160px;
      }

      .semester-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .card-header h3 {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .gpa-badge {
        padding: 6px 12px;
        background: var(--accent-light);
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--primary);
      }

      .no-record-row {
        text-align: center;
        padding: 40px !important;
        color: var(--text-light);
        font-style: italic;
        background: rgba(0, 0, 0, 0.02);
      }

      .dark-mode .no-record-row {
        background: rgba(255, 255, 255, 0.02);
      }

      /* Progress rings: pure CSS, driven by the --p custom property (0-100). */
      .ring {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: conic-gradient(
          var(--ring-fill, #ffffff) calc(var(--p, 0) * 1%),
          var(--ring-track, rgba(0, 0, 0, 0.12)) 0
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 10px),
          #000 calc(100% - 9px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 10px),
          #000 calc(100% - 9px)
        );
      }

      .dark-mode .ring {
        --ring-track: rgba(255, 255, 255, 0.1);
      }

      .dark-mode .accent-orange .ring {
        --ring-fill: #ff8c42;
      }

      .dark-mode .accent-blue .ring {
        --ring-fill: #48c6ef;
      }

      .dark-mode .accent-green .ring {
        --ring-fill: #00b09b;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 100%;
      }

      .responsive-table {
        display: block;
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
      }

      th,
      td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      @media (max-width: 1024px) {
        .semester-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="light-mode">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="header-left">
            <button type="button" class="menu-toggle" id="menu-open" aria-label="Open menu">
              <ion-icon name="menu-outline"></ion-icon>
            </button>
            <h1 class="page-title">Academic Records</h1>
          </div>
        </header>

        <section class="records-overview">
          <div class="progress-grid">
            <div class="card q-card accent-orange">
              <div class="chart-container">
                <div class="ring" id="degree-ring"></div>
                <div class="percent-circle" id="degree-pct">—</div>
              </div>
              <div class="q-card-body">
                <span class="q-label">Degree Progress</span>
                <div class="q-value" id="degree-value">0</div>
                <span class="q-sub" id="degree-sub">Units earned</span>
              </div>
            </div>

            <div class="card q-card accent-blue">
              <div class="chart-container">
                <div class="ring" id="passed-ring"></div>
                <div class="percent-circle" id="passed-pct">—</div>
              </div>
              <div class="q-card-body">
                <span class="q-label">Courses Passed</span>
                <div class="q-value" id="passed-value">0 / 0</div>
                <span class="q-sub" id="passed-sub">&nbsp;</span>
              </div>
            </div>

            <div class="card q-card accent-green">
              <div class="chart-container">
                <div class="ring" id="cgpa-ring"></div>
                <div class="percent-circle" id="cgpa-pct">—</div>
              </div>
              <div class="q-card-body">
                <span class="q-label">Cumulative GPA</span>
                <div class="q-value" id="cgpa-value">—</div>
                <span class="q-sub" id="cgpa-sub">&nbsp;</span>
              </div>
            </div>
          </div>
        </section>

        <section class="session-control">
          <div class="selector-wrapper">
            <label for="level-select">Select Academic Year</label>
            <select id="level-select" class="graph-select"></select>
          </div>
          <div class="selector-wrapper">
            <label for="degree-units">Total units to graduate</label>
            <input
              type="number"
              id="degree-units"
              class="graph-select"
              min="1"
              max="400"
              step="1"
              inputmode="numeric"
              placeholder="e.g. 140"
            />
          </div>
        </section>

        <div class="semester-grid">
          <div class="card table-card">
            <div class="card-header">
              <h3>1st Semester</h3>
              <span class="gpa-badge" id="sem1-gpa">GPA: —</span>
            </div>
            <div class="responsive-table">
              <table id="table-sem1">
                <thead>
                  <tr>
                    <th>S/N</th>
                    <th>Course Code</th>
                    <th>Unit</th>
                    <th>Grade</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="card table-card">
            <div class="card-header">
              <h3>2nd Semester</h3>
              <span class="gpa-badge" id="sem2-gpa">GPA: —</span>
            </div>
            <div class="responsive-table">
              <table id="table-sem2">
                <thead>
                  <tr>
                    <th>S/N</th>
                    <th>Course Code</th>
                    <th>Unit</th>
                    <th>Grade</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="../assets/js/app/shell.js"></script>
    <script type="module" src="../assets/js/pages/academic-records.js"></script>
  </body>
</html>
